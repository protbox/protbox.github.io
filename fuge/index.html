<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fUGE</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand" title="subterfUGE: a Game Boy music maker"><span>f</span>UGE</div>
            <span class="mode-chip" id="modeChip" hidden title="This project is a set of sound effects">SFX</span>
            <div class="group">
                <button class="btn" id="btnNew" type="button">New ▾</button>
                <button class="btn" id="btnOpen" type="button">Open</button>
                <button class="btn" id="btnSave" type="button" title="Save project (Ctrl+S). Shift-click or Ctrl+Shift+S to save a copy.">Save</button>
                <button class="btn accent" id="btnExport" type="button" title="Export (Ctrl+E for the main format)">Export ▾</button>
                <input type="file" id="fileInput" accept=".json,application/json,.mid,.midi,audio/midi,audio/x-midi" hidden>
            </div>
            <div class="group">
                <button class="btn icon" id="btnUndo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
                <button class="btn icon" id="btnRedo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
            </div>
            <div class="group">
                <button class="btn icon" id="btnStop" type="button" title="Stop" aria-label="Stop">■</button>
                <button class="btn icon" id="btnPlay" type="button" title="Play (Space)" aria-label="Play">▶</button>
                <button class="btn small" id="btnLoop" type="button" aria-pressed="false" title="Loop the selected order">Loop order</button>
                <div class="lcd" id="lcd">ORD 00 ROW 00</div>
                <label class="vol" title="Output volume"><span aria-hidden="true">VOL</span><input type="range" id="volume" min="0" max="100" value="70" aria-label="Output volume"></label>
            </div>
            <div class="group tempo">
                <label>Speed <select id="speed" title="Ticks per row. Lower is faster."></select></label>
                <label>Rows/beat <select id="rpb"></select></label>
                <span class="bpm" id="bpm"></span>
            </div>
            <div class="spacer"></div>
            <div class="group">
                <button class="btn icon" id="btnHelp" type="button" title="Help and docs (F1)" aria-label="Open the docs">?</button>
                <button class="btn icon" id="btnTheme" type="button" title="Switch light/dark" aria-label="Switch light or dark theme"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
            </div>
        </header>

        <aside class="sidebar" aria-label="Instruments">
            <div class="side-head">
                <p class="label">Instruments</p>
                <button class="btn small" id="btnPresets" type="button">Presets…</button>
            </div>
            <div class="inst-list" id="instList"></div>
            <div class="editor" id="instEditor"></div>
        </aside>

        <main class="main" id="main">
            <section class="arrange" aria-label="Arrangement">
                <div class="bar">
                    <p class="label" id="arrLabel">Arrangement</p>
                    <button class="btn small" id="ordAdd" type="button" title="Insert an empty order after the selected one">+ Order</button>
                    <button class="btn small" id="ordDup" type="button" title="Repeat the selected order">Repeat</button>
                    <button class="btn small icon" id="ordLeft" type="button" title="Move order left" aria-label="Move order left">◀</button>
                    <button class="btn small icon" id="ordRight" type="button" title="Move order right" aria-label="Move order right">▶</button>
                    <button class="btn small" id="ordDel" type="button" title="Delete the selected order">Delete</button>
                    <select id="ordRows" aria-label="Length of the selected order" title="How many rows the selected order plays before moving on"></select>
                    <span class="hint" id="arrInfo"></span>
                    <div class="spacer"></div>
                    <div class="group meta">
                        <input type="text" id="songName" maxlength="60" placeholder="Song name" aria-label="Song name">
                        <input type="text" id="songArtist" maxlength="60" placeholder="Artist" aria-label="Artist">
                    </div>
                </div>
                <div class="arr-body">
                    <div class="track-heads" id="trackHeads"></div>
                    <div class="lanes-scroll" id="lanesScroll">
                        <div class="lanes" id="lanes"></div>
                    </div>
                </div>
            </section>
            <div class="splitter" id="splitter" role="separator" aria-orientation="horizontal" aria-label="Resize arrangement"></div>
            <section class="pattern" aria-label="Pattern editor">
                <div class="bar">
                    <div class="pat-title" id="patTitle"></div>
                    <div class="sfx-ctl" id="sfxCtl" hidden>
                        <input type="text" id="sfxName" maxlength="32" aria-label="Sound effect name" title="Sound effect name">
                        <select id="sfxRows" aria-label="Sound effect length" title="Length in rows"></select>
                        <span class="hint" id="sfxDur"></span>
                    </div>
                    <select id="patSelect" aria-label="Pattern in this slot"></select>
                    <button class="btn small" id="patUnique" type="button" title="Copy this pattern so edits only affect this slot">Make unique</button>
                    <button class="btn small" id="patClear" type="button">Clear</button>
                    <div class="scale-ctl" title="Darken the rows that aren't in this scale">
                        <select id="scaleRoot" aria-label="Scale key"></select>
                        <select id="scaleName" aria-label="Scale"></select>
                    </div>
                    <div class="kb-ctl">
                        <button class="btn small" id="btnKb" type="button" aria-pressed="false" title="Keyboard piano (`): play the chosen scale on your computer keyboard">⌨ Keys</button>
                        <span class="kb-oct" id="kbOct" hidden>
                            <button class="btn small icon" id="kbDown" type="button" title="Lower octave" aria-label="Lower octave">−</button>
                            <span id="kbBase" title="The note on the Z key, the lowest you can play"></span>
                            <button class="btn small icon" id="kbUp" type="button" title="Higher octave" aria-label="Higher octave">+</button>
                        </span>
                    </div>
                    <div class="spacer"></div>
                    <div class="seg" role="group" aria-label="Tool">
                        <button type="button" id="toolDraw" aria-pressed="true" title="Draw (D)">✎ Draw</button>
                        <button type="button" id="toolSelect" aria-pressed="false" title="Select (M). Drag a box around notes.">⬚ Select</button>
                        <button type="button" id="toolErase" aria-pressed="false" title="Erase (E)">⌫ Erase</button>
                    </div>
                    <button class="btn small" id="btnGhost" type="button" aria-pressed="true" title="Show the other channels faintly">Ghosts</button>
                </div>
                <div class="roll-wrap">
                    <div class="roll-area">
                        <div class="roll-scroll" id="rollScroll">
                            <div class="roll-inner" id="rollInner">
                                <div class="corner"></div>
                                <canvas class="ruler" id="ruler" title="Click to set where playback starts"></canvas>
                                <canvas class="keys" id="keys"></canvas>
                                <canvas id="roll"></canvas>
                                <div class="playhead" id="rollHead"></div>
                            </div>
                        </div>
                        <div class="roll-empty" id="rollEmpty" hidden></div>
                    </div>
                    <aside class="inspector" id="inspector" aria-label="Note inspector"></aside>
                </div>
            </section>
        </main>

        <footer class="statusbar">
            <span id="status" role="status"></span>
            <span id="drawHint"></span>
        </footer>
    </div>

    <div class="modal" id="presetModal" role="dialog" aria-modal="true" aria-labelledby="presetTitle">
        <div class="dialog">
            <div class="dialog-head">
                <h2 id="presetTitle">Instrument presets</h2>
                <button class="btn small" id="presetClose" type="button">Close</button>
            </div>
            <div class="dialog-tabs" id="presetTabs"></div>
            <div class="preset-grid" id="presetGrid"></div>
        </div>
    </div>

    <div class="modal" id="infoModal" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
        <div class="dialog info-dialog">
            <div class="dialog-head">
                <h2 id="infoTitle"></h2>
                <button class="btn small" id="infoClose" type="button">OK</button>
            </div>
            <div class="info-body" id="infoBody"></div>
        </div>
    </div>

    <div class="modal" id="waveModal" role="dialog" aria-modal="true" aria-labelledby="waveTitle">
        <div class="dialog info-dialog wave-dialog">
            <div class="dialog-head">
                <h2 id="waveTitle">Waveform values</h2>
                <button class="btn small" id="waveCancel" type="button">Cancel</button>
            </div>
            <div class="info-body">
                <p>32 values from 0 to 15, separated by spaces or commas. A hUGETracker hex string like <code>0123…</code> works too.</p>
                <textarea id="waveText" rows="3" spellcheck="false" aria-label="Waveform values"></textarea>
                <div class="wave-check">
                    <canvas id="wavePreview" aria-hidden="true"></canvas>
                    <span id="waveMsg" role="status"></span>
                </div>
                <div class="wave-actions">
                    <button class="btn accent" id="waveApply" type="button">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="alert"></div>

    <script src="js/desktop.js"></script>
    <script src="js/presets.js"></script>
    <script src="js/uge.js"></script>
    <script src="js/gbaudio.js"></script>
    <script src="js/demo.js"></script>
    <script src="js/midi.js"></script>
    <script src="demos/demos.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
