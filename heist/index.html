<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Files</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Libre+Baskerville:ital@0;1&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

    <nav class="case-picker" id="casePicker" aria-label="Case files"></nav>

    <header class="case-head">
        <span class="case-stamp" id="caseStamp">CONFIDENTIAL</span>
        <h1 id="caseTitle"></h1>
        <div class="subhead" id="caseSubhead"></div>
        <div class="brief" id="caseBrief"></div>
    </header>

    <div class="layout">

        <div class="column">
            <div class="section-label">The Word on the Street</div>
            <div class="clues" id="clueList"></div>
        </div>

        <div class="column">
            <div class="section-label">The Board</div>
            <div class="legend">
                <span><b>Click</b> ❌ rule out</span>
                <span><b>Hold</b> ✅ confirm</span>
                <span><b>Right-click</b> clear the cell</span>
                <span><b>Shaded</b> worked out for you</span>
            </div>
            <div class="board-panel">
                <div class="grids" id="grids"></div>
            </div>
            <div class="board-tools">
                <button class="reset-link" type="button" id="clearBtn">Clear the board</button>
            </div>

            <div class="accusation">
                <h2>Close the Case</h2>

                <div class="accusation-locked" id="accusationLocked"></div>

                <div class="accusation-panel" id="accusationPanel">
                    <p class="help">Every name gets checked against the clues</p>
                    <div class="results-list" id="resultsList"></div>
                    <button class="close-case" id="closeBtn">Make the Call</button>
                    <div class="verdict" id="verdict"></div>
                </div>
            </div>

        </div>

    </div>

    <footer>Case files · four names, one story that holds up</footer>
</div>

<script src="js/casefiles.js"></script>
<script src="js/puzzles/pawnshop-ledger.js"></script>
<script src="js/puzzles/kessler-job.js"></script>
<script src="js/puzzles/marlowe-street.js"></script>
<script src="js/board.js"></script>
<script src="js/game.js"></script>
</body>
</html>
